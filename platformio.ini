; dosipas-c: PlatformIO project file for the library's own tests.
;
;   pio test -e native      host tests (fetches and builds mbedTLS on first run, see tools/pio_native_mbedtls.py)
;   pio test -e esp32dev    the same tests on an ESP32 (prints arena/heap/stack/time per fixture)
;   pio run  -e esp32dev    size check of the library objects for the ESP32
;
; Users of the library do not need this file: add "dosipas-c" to lib_deps.
[platformio]
default_envs = native

[env]
build_flags =
    -Isrc
    -DDOSIPAS_WITH_MBEDTLS=1
test_build_src = yes
test_framework = unity

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=gnu99
    -Wall -Wextra
    -DUNITY_INCLUDE_DOUBLE
extra_scripts = pre:tools/pio_native_mbedtls.py
; Set MBEDTLS_TAG=v2.28.10 in the environment to test against the mbedTLS of Arduino core 2.0.17.

[env:native_asan]
extends = env:native
build_type = debug
build_flags =
    ${env:native.build_flags}
    -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_speed = 115200
build_flags =
    ${env.build_flags}
    -DUNITY_INCLUDE_DOUBLE
; The robustness group flips every bit of every fixture: give the upload/test a generous timeout.
test_testing_command =
