; Build the example against the library checkout two levels up.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
lib_ldf_mode = deep
build_flags = -DDOSIPAS_WITH_MBEDTLS=1

; Same sketch without signature verification (size comparison; summary then prints "L2 signature not verifiable").
[env:esp32dev_noverify]
extends = env:esp32dev
build_flags = -DDOSIPAS_WITH_MBEDTLS=0
