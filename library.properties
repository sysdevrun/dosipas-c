name=dosipas-c
version=0.1.0
author=Théophile Helleboid <contact@sys-dev-run.fr>
maintainer=Théophile Helleboid <contact@sys-dev-run.fr>
sentence=Decode and verify DOSIPAS tickets (UIC barcodes with Intercode 6 extensions) on the ESP32.
paragraph=Table-driven ASN.1 UPER decoder generated from the dosipas-ts 4.1.0 schemas: UIC barcode header U1/U2, FCB1/FCB2/FCB3 rail ticket data, Intercode 6 issuing and dynamic data, FDC1 dynamic content. Caller-provided arena, no malloc, bounds-checked. ECDSA signature verification (P-256/384/521) with the mbedTLS shipped in the ESP32 core. JSON output identical to dosipas-ts, and a 33x14 ASCII summary for small displays.
category=Data Processing
url=https://github.com/sysdevrun/dosipas-c
architectures=esp32
includes=dosipas.h,DosipasDecoder.h
